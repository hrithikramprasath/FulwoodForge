[project]
name = "backend"
version = "2.0.0"
description = "Fulwood Forge backend — prompt engine, Gemini structured outputs, MySQL 8.4 LTS & native Argon2id auth (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "asyncmy>=0.2.10",
    "cryptography>=44.0.0",
    "fastapi>=0.139.2",
    "google-genai>=2.22.0",
    # Imported directly by app/services/gemini.py to classify transport timeouts as
    # retryable. Already present transitively via google-genai; declared so it is not
    # an undeclared import.
    "httpx>=0.28.1",
    "playwright>=1.61.0",
    "pydantic>=2.13.5",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
# Third-party deprecations raised inside starlette.testclient only; everything else is an error.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
