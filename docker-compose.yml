# Production stack: MySQL 8.4 LTS (InnoDB) + Fulwood Forge FastAPI/React Runtime
# Native username/password + Argon2id + ff_session authentication (NG-01, REQ-SEC-04).

services:
  mysql:
    image: mysql:8.4
    command:
      - "mysqld"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-fulwood_forge}"
      MYSQL_USER: "${MYSQL_USER:-fulwood_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mysql -h 127.0.0.1 -u$$MYSQL_USER --password=$$MYSQL_PASSWORD -D $$MYSQL_DATABASE -e 'SELECT 1'"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks:
      - internal

  app:
    build: .
    init: true
    image: fulwood-forge:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges=true
      - seccomp=${SECCOMP_PROFILE_PATH:-./deploy/chrome-seccomp.json}
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,nosuid,size=512m,mode=1777
      - /home/appuser:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=700
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:4180:8000"
    environment:
      PORT: "8000"
      ARTIFACTS_DIR: "/tmp/artifacts"
      GEMINI_API_KEY: "${GEMINI_API_KEY:?GEMINI_API_KEY is required}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_USER:-fulwood_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-fulwood_forge}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME is required}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-24}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000}"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
