name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ~/FulwoodForge
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main:refs/remotes/origin/main
          git reset --hard origin/main
          docker compose build app
          docker compose up -d app
